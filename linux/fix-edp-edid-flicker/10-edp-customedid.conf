# Ep driver NVIDIA dung EDID da luu cho panel eDP (DFP-5 = DP-4).
#
# Ly do: thinh thoang luc boot, driver doc EDID cua panel qua kenh eDP AUX
# that bai, roi bia ra mot EDID gia chi co mode 640x480 -> man hinh nhay va
# khong len hinh, dong thoi GNOME mat layout da luu.
# EDID o day duoc service edp-edid-cache.service cap nhat moi khi doc duoc
# EDID that, nen file luon la ban that gan nhat.
Section "Device"
    Identifier  "nvidia-edp-customedid"
    Driver      "nvidia"
    Option      "CustomEDID" "DFP-5:/etc/X11/edid-edp.bin"
EndSection
